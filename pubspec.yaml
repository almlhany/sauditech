name: sahwa_alarm
description: Smart Alarm and Tasks App in Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # مكتبات المنبه والإشعارات وتخزين البيانات
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  intl: ^0.19.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true