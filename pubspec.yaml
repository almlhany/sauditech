name: sahwa
description: تطبيق صحوة - منبه ومهام ذكية
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^6.1.1
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2
  timezone: ^0.9.2
  flutter_timezone: ^1.0.8
  intl: ^0.19.0
  # السحابية والنسخ الاحتياطي
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  google_sign_in: ^6.1.6
  # التقويم
  device_calendar: ^4.3.2
  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  # الويدجت
  home_widget: ^0.4.1
  # الخطوط
  google_fonts: ^6.1.0
  # التشفير
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  # المشاركة
  share_plus: ^7.2.1
  # الاتصال
  connectivity_plus: ^5.0.2
  # إشعارات فورية
  flutter_local_notifications: ^17.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/fonts/